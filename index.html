<!doctype html>

<div id="toast" class="toast"></div>

<div id="app" class="hidden">

    <section id="page-inventaris" class="page hidden"></section>
    <section id="page-transaksi" class="page hidden"></section>
    <section id="page-laporan" class="page hidden"></section>
    <section id="page-pengaturan" class="page hidden"></section>

</div>
<script src="config.js"></script><script src="script.js"></script>
